# __EVALSET_ID__ 多 Agent 对比清单（suite --agents-file 用）。
#
# 注意：cli 命令的 cwd 是每个 run 的 workspace，引用本集合内脚本应使用
# $AEL_RUN_DIR 锚定。runs 布局为 <set>/runs/<task-id>/<run-id>，向上三级即集合根。
#
# run-agent.sh 的第二个参数是 profile：claude / codex / custom（见 scripts/run-agent.sh 头部说明）。
# 把 current / candidate 换成你们要对比的两个版本：可以是不同 profile，也可以是同一 profile
# 配不同模型（在 cmd 前加 AEL_AGENT_MODEL=xxx）。label 会进入 suite 报告和 history 趋势。
agents:
  - label: baseline-scripted
    type: scripted                 # 各任务 samples/replay.yaml 回放，作为「任务本身没坏」的基线
  - label: current
    type: cli
    cmd: 'bash "$AEL_RUN_DIR/../../../scripts/run-agent.sh" claude'
  - label: candidate
    type: cli
    cmd: 'bash "$AEL_RUN_DIR/../../../scripts/run-agent.sh" codex'
